name: Build and Test

on:
  workflow_call:
    inputs:
      java:
        required: false
        type: string
        default: 17
      branch:
        required: false
        type: string
        description: Branch to run the build against
        default: trunk
      os:
        required: false
        type: string
        description: Operating system to run the build on
        default: ubuntu_24
      job:
        required: false
        type: string
        description: >-
          Job to run, choose from "build" and "test".
          "test" implies "build".
        default: "build"

permissions: { }

concurrency:
  group: >-
    build-and-test
    ${{ github.workflow }}
    ${{ github.repository == 'apache/hadoop' && github.run_id || github.ref }}
    ${{ inputs.java }}
    ${{ inputs.branch }}
    ${{ inputs.os }}
    ${{ inputs.job }}
  cancel-in-progress: true

env:
  BRANCH: ${{ inputs.branch }}
  OS: ${{ inputs.os }}
  # Java version for seeding the cache
  JAVA_VERSION: 17
  DOCKER_WORKSPACE: /home/runner/workspace
  MAVEN_ARGS:
    --batch-mode
    -Pyarn-ui
    -Pnative
    -Drequire.test.libhadoop
    -Drequire.fuse
    -Drequire.openssl
    -Drequire.snappy
    -Drequire.valgrind
    -Dmaven.test.failure.ignore=false
    --settings /home/runner/workspace/.github/maven-settings.xml
    --show-version
    -Dsurefire.rerunFailingTestsCount=2
  MVNW_VERBOSE: true

jobs:
  precondition:
    runs-on: ubuntu-slim
    steps:
      - run: echo 1
  build-image:
    runs-on: ubuntu-slim
    needs:
      - precondition
    steps:
      - run: echo 2
  build:
    runs-on: ubuntu-slim
    needs:
      - precondition
      - build-image
    steps:
      - run: echo 3
  test:
    if: inputs.job == 'test'
    runs-on: ubuntu-slim
    needs:
      - precondition
      - build-image
      - build
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        module:
          - hadoop-auth
          - hadoop-common
          - hadoop-minikdc
    steps:
      - run: echo 4
