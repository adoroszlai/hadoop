name: Build and Test

on:
  workflow_call:
    inputs:
      java:
        required: false
        type: string
        default: 17
      branch:
        required: false
        type: string
        description: Branch to run the build against
        default: trunk
      os:
        required: false
        type: string
        description: Operating system to run the build on
        default: ubuntu_24
      jobs:
        required: true
        type: string
        description: >-
          Jobs to run, and should be in JSON Array format.
          Candidates are "build-image", "build", "create-cache", "test".

permissions: { }

concurrency:
  group: >-
    build-and-test
    ${{ github.workflow }}
    ${{ github.repository == 'apache/hadoop' && github.run_id || github.ref }}
    ${{ inputs.java }}
    ${{ inputs.branch }}
    ${{ inputs.os }}
    ${{ inputs.jobs }}
  cancel-in-progress: true

env:
  BRANCH: ${{ inputs.branch }}
  OS: ${{ inputs.os }}
  CREATE_CACHE: ${{ contains(fromJSON(inputs.jobs), 'create-cache') }}
  RUN_TEST: ${{ contains(fromJSON(inputs.jobs), 'test') }}
  DOCKER_WORKSPACE: /home/runner/workspace
  MAVEN_ARGS:
    --batch-mode
    -Pyarn-ui
    -Pnative
    -Drequire.test.libhadoop
    -Drequire.fuse
    -Drequire.openssl
    -Drequire.snappy
    -Drequire.valgrind
    -Dmaven.test.failure.ignore=false
    --settings /home/runner/workspace/.github/maven-settings.xml
    --show-version
    -Dsurefire.rerunFailingTestsCount=2
  MAVEN_OPTS: -Daether.connector.http.connectionMaxTtl=25 -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.intervalMax=30000
  MVNW_VERBOSE: true

jobs:
  # TODO: use common composite actions in .github/actions/
  precondition:
    name: Preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_image_url: ${{ steps.variables.outputs.build_image_url }}
      uid: ${{ steps.variables.outputs.uid }}
      gid: ${{ steps.variables.outputs.gid }}
    steps:
      - name: Set up Outputs
        id: variables
        # Security: passing inputs.{os, branch} through variables removes
        # ability to do shell injection below.
        # See: https://securitylab.github.com/resources/github-actions-untrusted-input/
        run: |
          # Convert to lowercase to meet Docker repo name requirement
          REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          set -x
          echo "build_image_url=ghcr.io/${REPO_OWNER}/gha-build-${OS}:${BRANCH}-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
  build-image:
    if: ${{ contains(fromJSON(inputs.jobs), 'build-image') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - precondition
    # Security: this does not leak write access for our image repository to
    # forked repos.
    #
    # We have `packages: write` permissions for our GITHUB_TOKEN below. However:
    #
    # - For `pull_request`, GitHub downgrades GITHUB_TOKEN permissions to
    #   read-only.
    # - For `push` triggers on a fork, the GITHUB_TOKEN retains write
    #   permissions, but the `push` is happening in the context of the fork, not
    #   the upstream repo.
    # - `pull_request_target` events (not used here) use the base repo's
    #   default branch. This prevents an attacker from adding code in a pull
    #   request which prints / leaks secrets, etc.. Also the GITHUB_TOKEN we
    #   use to grant access to writing to the image repo. is scoped to the
    #   repository it runs on. Even if a fork were to gain access to a
    #   GITHUB_TOKEN with write privileges, it doesn't grant access for other
    #   repositories to write.
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push ${{ inputs.os }} base build image for ${{ inputs.branch }}
        id: docker_build_base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/
          file: ./dev-support/docker/Dockerfile_${{ inputs.os }}
          push: true
          tags: ${{ needs.precondition.outputs.build_image_url }}-base
          cache-from: type=registry,ref=ghcr.io/apache/hadoop/gha-build-${{ inputs.os }}-image-cache:${{ inputs.branch }}
      - name: User-specific Dockerfile
        run: |
          cat > /tmp/Dockerfile.gha <<UserSpecificDocker
          FROM ${IMAGE_URL}-base
          RUN rm -f /var/log/faillog /var/log/lastlog
          RUN groupadd --non-unique -g ${GROUP_ID} ${USER}
          RUN useradd -g ${GROUP_ID} -u ${USER_ID} -k /root -m ${USER}
          RUN echo "${USER} ALL=NOPASSWD: ALL" > "/etc/sudoers.d/hadoop-build-${USER_ID}"
          UserSpecificDocker
        env:
          IMAGE_URL: ${{ needs.precondition.outputs.build_image_url }}
          USER_ID: ${{ needs.precondition.outputs.uid }}
          GROUP_ID: ${{ needs.precondition.outputs.gid }}
      - name: Build and push ${{ inputs.os }} build image for ${{ inputs.branch }}
        id: docker_build_gha
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/
          file: /tmp/Dockerfile.gha
          push: true
          tags: ${{ needs.precondition.outputs.build_image_url }}
  build:
    if: ${{ contains(fromJSON(inputs.jobs), 'build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - precondition
      - build-image
    outputs:
      junit-modules: ${{ steps.junit-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup JDK ${{ inputs.java }}
        id: restore-cache
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: ${{ inputs.java }}
          only-exact-hit: ${{ env.CREATE_CACHE == 'true' }}
      - name: Seed cache
        if: ${{ env.CREATE_CACHE == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS \
            -e MAVEN_OPTS \
            -e MVNW_VERBOSE \
            --user $UID \
            -v $GITHUB_WORKSPACE:$DOCKER_WORKSPACE \
            -v $HOME/.m2:/home/runner/.m2 \
            -w $DOCKER_WORKSPACE \
            $IMAGE \
            ./mvnw $MAVEN_ARGS dependency:resolve-plugins
        env:
          IMAGE: ${{ needs.precondition.outputs.build_image_url }}
          UID: ${{ needs.precondition.outputs.uid }}
      - name: Build
        shell: bash
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS \
            -e MAVEN_OPTS \
            -e MVNW_VERBOSE \
            --user $UID \
            -v $GITHUB_WORKSPACE:$DOCKER_WORKSPACE \
            -v $HOME/.m2:/home/runner/.m2 \
            -w $DOCKER_WORKSPACE \
            $IMAGE \
            ./mvnw $MAVEN_ARGS clean install -DskipTests
        env:
          IMAGE: ${{ needs.precondition.outputs.build_image_url }}
          UID: ${{ needs.precondition.outputs.uid }}
      - name: Store own jars for tests
        if: ${{ env.RUN_TEST == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hadoop-repo-java-${{ inputs.java }}-${{ inputs.os }}-${{ inputs.branch }}
          path: ~/.m2/repository/org/apache/hadoop
          retention-days: 5
      - name: Store hadoop-common for tests
        if: ${{ env.RUN_TEST == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hadoop-common-java-${{ inputs.java }}-${{ inputs.os }}-${{ inputs.branch }}
          path: hadoop-common-project/hadoop-common/target
          retention-days: 5
      - name: Delete own jars from repo (except thirdparty)
        if: ${{ env.CREATE_CACHE == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: |
          mv -v ~/.m2/repository/org/apache/hadoop/thirdparty ./
          rm -fr ~/.m2/repository/org/apache/hadoop/*
          mv -v thirdparty ~/.m2/repository/org/apache/hadoop/
      - name: Save cache for Maven dependencies
        if: ${{ env.CREATE_CACHE == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.restore-cache.outputs.cache-key }}
      - name: List repo contents
        if: ${{ env.CREATE_CACHE == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        run: find ~/.m2/{repository,wrapper} -type f | sort | xargs ls -lh
      - name: Find tests
        id: junit-modules
        run: |
          bash dev-support/bin/junit_modules.sh
  test:
    if: ${{ contains(fromJSON(inputs.jobs), 'test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300 # TODO speed up tests or split further to reduce longest matrix runtime
    needs:
      - precondition
      - build
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        module: ${{ fromJson(needs.build.outputs.junit-modules) }}
        exclude:
          - module: hadoop-yarn-applications-catalog-webapp
          - module: hadoop-hdfs
        include:
          - module: hadoop-hdfs
            opt: -Dgroups=slow
          - module: hadoop-hdfs
            opt: -DexcludedGroups=slow
    steps:
      - name: Checkout Hadoop repository
        uses: actions/checkout@v6
        # In order to fetch changed files
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup JDK ${{ inputs.java }}
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: ${{ inputs.java }}
      - name: Restore own jars
        uses: actions/download-artifact@v8
        with:
          name: hadoop-repo-java-${{ inputs.java }}-${{ inputs.os }}-${{ inputs.branch }}
          path: ~/.m2/repository/org/apache/hadoop
      - name: Restore hadoop-common
        uses: actions/download-artifact@v8
        with:
          name: hadoop-common-java-${{ inputs.java }}-${{ inputs.os }}-${{ inputs.branch }}
          path: hadoop-common-project/hadoop-common/target
      - name: Test (Java ${{ inputs.java }}) ${{ inputs.os }}-${{ inputs.branch }}
        shell: bash
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            export MAVEN_ARGS="$MAVEN_ARGS --offline"
          fi
          docker run --rm \
            -e GITHUB_ACTIONS \
            -e MVNW_VERBOSE \
            --user $UID \
            -v $GITHUB_WORKSPACE:$DOCKER_WORKSPACE \
            -v $HOME/.m2:/home/runner/.m2 \
            -w $DOCKER_WORKSPACE \
            $IMAGE \
            ./mvnw $MAVEN_ARGS -pl :$MODULE $OPT test -Dsurefire.excludesFile=$DOCKER_WORKSPACE/.github/gha-tests/exclude-tests.txt
        env:
          CACHE_HIT: ${{ steps.restore-cache.outputs.cache-hit }}
          IMAGE: ${{ needs.precondition.outputs.build_image_url }}
          MODULE: ${{ matrix.module }}
          OPT: ${{ matrix.opt }}
          UID: ${{ needs.precondition.outputs.uid }}
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-logs-${{ matrix.module }}-java${{ inputs.java }})-${{ inputs.os }}-${{ inputs.branch }}
          path: |
            **/target/**/*.log
            **/target/surefire-reports/**
