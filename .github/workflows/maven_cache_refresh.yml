name: Maven Cache Refresh

# Security: write privileges are safe since this is triggered
# only by `push` or `workflow_dispatch` (both imply user has write access).
on:
  push:
    branches:
      - '**'
    paths:
      - '**/pom.xml'
      - '.github/workflows/maven_cache_refresh.yml'
      - '.mvn/wrapper/maven-wrapper.properties'
  workflow_dispatch:

permissions: { }

concurrency:
  group: maven-cache-refresh-${{ github.sha }}
  cancel-in-progress: false

env:
  MAVEN_ARGS:
    --batch-mode
    --no-transfer-progress
    --show-version
    -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
  MAVEN_USER_HOME: ${{ github.workspace }}/.m2
  MVNW_VERBOSE: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          check-latest: false
          settings-path: ${{ env.MAVEN_USER_HOME }}

      - name: Calculate cache key
        id: key
        run: |
          set -x
          echo "repo=maven-repo-${{ hashFiles('**/pom.xml') }}" >> $GITHUB_OUTPUT
          echo "wrapper=maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}" >> $GITHUB_OUTPUT

      - name: Lookup Maven repository
        id: lookup-repo
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          path: ${{ env.MAVEN_USER_HOME }}/repository
          key: ${{ steps.key.outputs.repo }}

      - name: Lookup Maven wrapper
        id: lookup-wrapper
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          path: ${{ env.MAVEN_USER_HOME }}/wrapper
          key: ${{ steps.key.outputs.wrapper }}

      - name: Fetch plugin dependencies
        if: steps.lookup-repo.outputs.stash-hit != 'true' || steps.lookup-wrapper.outputs.stash-hit != 'true'
        run: |
          # fetch plugins, even if not part of normal build
          # FIXME temporarily disable plugins
          # ./mvnw dependency:resolve-plugins help:help
          # build
          # FIXME temporarily restrict to few modules
          ./mvnw -DskipShade -Dtest=void --fail-never verify -am -pl :hadoop-project

      - name: Save Maven wrapper
        if: steps.lookup-wrapper.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ${{ env.MAVEN_USER_HOME }}/wrapper
          key: ${{ steps.key.outputs.wrapper }}
          retention-days: 90

      - name: Save Maven repository
        if: steps.lookup-repo.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ${{ env.MAVEN_USER_HOME }}/repository
          key: ${{ steps.key.outputs.repo }}
          retention-days: 90
